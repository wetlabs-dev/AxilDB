services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plants
      POSTGRES_PASSWORD: plants
      POSTGRES_DB: axildb
    ports:
      - "5433:5432"
    volumes:
      - axildb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plants -d axildb"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
    command: sh -c "npx prisma db push && npm run db:bootstrap"
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
      NEXT_PUBLIC_APP_URL: https://app.axildb.com
      NEXT_PUBLIC_MARKETING_URL: https://axildb.com
      NEXT_PUBLIC_GITHUB_URL: https://github.com/wetlabs-dev/AxilDB
      NEXT_PUBLIC_DONATE_URL: https://ko-fi.com/wetlabs
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-AxilDB <no-reply@axildb.com>}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/labels:/app/public/labels
volumes:
  axildb_pgdata:
  caddy_data:
  caddy_config:

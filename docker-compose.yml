services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plants
      POSTGRES_PASSWORD: plants
      POSTGRES_DB: axildb
    ports:
      - "5433:5432"
    volumes:
      - axildb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plants -d axildb"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
    command: sh -c "npx prisma db push --accept-data-loss && npm run db:bootstrap"
  app:
    build: .
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
      NEXT_PUBLIC_APP_URL: https://app.axildb.com
      NEXT_PUBLIC_MARKETING_URL: https://axildb.com
      NEXT_PUBLIC_GITHUB_URL: https://github.com/wetlabs-dev/AxilDB
      NEXT_PUBLIC_DONATE_URL: https://ko-fi.com/wetlabs
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/labels:/app/public/labels
  reminders:
    build:
      context: .
      target: builder
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
      NEXT_PUBLIC_APP_URL: https://app.axildb.com
    command: sh -c "while true; do npm run email:send-reminders; sleep $${REMINDER_WORKER_INTERVAL_SECONDS:-300}; done"
  metrics:
    build:
      context: .
      target: builder
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/labels:/app/public/labels
    command: sh -c "while true; do npm run metrics:collect; sleep $${METRICS_WORKER_INTERVAL_SECONDS:-300}; done"
volumes:
  axildb_pgdata:
  caddy_data:
  caddy_config:

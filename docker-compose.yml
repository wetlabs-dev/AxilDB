services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plants
      POSTGRES_PASSWORD: plants
      POSTGRES_DB: axildb
    ports:
      - "5433:5432"
    volumes:
      - axildb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plants -d axildb"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/New_York}
      AXILDB_DEFAULT_TIMEZONE: ${AXILDB_DEFAULT_TIMEZONE:-America/New_York}
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
    command: sh -c "npm run db:migrate:deploy && npm run db:bootstrap"
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/New_York}
      AXILDB_DEFAULT_TIMEZONE: ${AXILDB_DEFAULT_TIMEZONE:-America/New_York}
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
      NEXT_PUBLIC_APP_URL: https://app.axildb.com
      NEXT_PUBLIC_MARKETING_URL: https://axildb.com
      NEXT_PUBLIC_GITHUB_URL: https://github.com/wetlabs-dev/AxilDB
      NEXT_PUBLIC_DONATE_URL: https://ko-fi.com/wetlabs
      GIT_COMMIT: ${GIT_COMMIT:-}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/labels:/app/public/labels
      - ./public/manual:/app/public/manual
      - ./backups:/app/backups
  reminders:
    build:
      context: .
      target: builder
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/New_York}
      AXILDB_DEFAULT_TIMEZONE: ${AXILDB_DEFAULT_TIMEZONE:-America/New_York}
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
      NEXT_PUBLIC_APP_URL: https://app.axildb.com
    command: sh -c "while true; do npm run email:send-reminders; sleep $${REMINDER_WORKER_INTERVAL_SECONDS:-300}; done"
  image-moderation:
    build:
      context: .
      target: builder
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/New_York}
      AXILDB_DEFAULT_TIMEZONE: ${AXILDB_DEFAULT_TIMEZONE:-America/New_York}
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
    volumes:
      - ./public/uploads:/app/public/uploads
    command: sh -c "while true; do npm run images:moderate; sleep $${IMAGE_MODERATION_WORKER_INTERVAL_SECONDS:-180}; done"
  ai-curator:
    build:
      context: .
      target: builder
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/New_York}
      AXILDB_DEFAULT_TIMEZONE: ${AXILDB_DEFAULT_TIMEZONE:-America/New_York}
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
      NEXT_PUBLIC_APP_URL: https://app.axildb.com
    command: sh -c "while true; do npm run ai-curator:process; sleep $${AI_CURATOR_WORKER_INTERVAL_SECONDS:-120}; done"
  events:
    build:
      context: .
      target: builder
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
      AXILDB_EVENT_ENGINE_ENABLED: ${AXILDB_EVENT_ENGINE_ENABLED:-true}
      EVENT_WORKER_BATCH_SIZE: ${EVENT_WORKER_BATCH_SIZE:-50}
      EVENT_WORKER_MAX_ATTEMPTS: ${EVENT_WORKER_MAX_ATTEMPTS:-8}
      EVENT_WORKER_STALE_MINUTES: ${EVENT_WORKER_STALE_MINUTES:-15}
    command: sh -c "while true; do npm run events:process; sleep $${EVENT_WORKER_INTERVAL_SECONDS:-15}; done"
  metrics:
    build:
      context: .
      target: builder
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/New_York}
      AXILDB_DEFAULT_TIMEZONE: ${AXILDB_DEFAULT_TIMEZONE:-America/New_York}
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
      NEXT_PUBLIC_APP_URL: https://app.axildb.com
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/labels:/app/public/labels
    command: sh -c "while true; do npm run metrics:collect; sleep $${METRICS_WORKER_INTERVAL_SECONDS:-300}; done"
  backups:
    build:
      context: .
      target: builder
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/New_York}
      AXILDB_DEFAULT_TIMEZONE: ${AXILDB_DEFAULT_TIMEZONE:-America/New_York}
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
      GIT_COMMIT: ${GIT_COMMIT:-}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/labels:/app/public/labels
      - ./backups:/app/backups
    command: sh -c "while true; do npm run backup:worker -- --once; sleep $${BACKUP_WORKER_INTERVAL_SECONDS:-300}; done"
  docs:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    profiles:
      - docs
    working_dir: /app
    env_file:
      - path: ./.env
        required: false
      - path: /etc/axildb/axildb.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      AXILDB_DEFAULT_TIMEZONE: ${AXILDB_DEFAULT_TIMEZONE:-America/New_York}
      DATABASE_URL: postgresql://plants:plants@db:5432/axildb?schema=public
    volumes:
      - .:/app
      - axildb_docs_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run docs:manual && npm run docs:screenshots"
volumes:
  axildb_pgdata:
  caddy_data:
  caddy_config:
  axildb_docs_node_modules:
